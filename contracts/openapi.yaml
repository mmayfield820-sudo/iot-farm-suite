openapi: 3.0.3
info:
  title: Smart Farm API
  version: 0.1.0
  description: 前端与后端之间的 REST API 契约。实现应与本文件保持一致。
servers:
  - url: http://localhost:8080/api
tags:
  - name: Auth
  - name: Farms
  - name: Devices
  - name: Telemetry
  - name: Commands
  - name: Alerts
  - name: Irrigation
  - name: Chat
paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: 用户登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/register:
    post:
      tags: [Auth]
      summary: Submit a registration application
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistrationRequest' }
      responses: { '201': { description: Registration application created } }
  /registration-resources:
    get:
      tags: [Auth]
      summary: List public registration scope choices
      responses: { '200': { description: Farms and plots available for registration } }
  /registration-applications:
    get:
      tags: [Auth]
      summary: List registration applications
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Registration applications } }
  /registration-applications/{applicationId}/approve:
    put:
      tags: [Auth]
      summary: Approve a registration application
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: applicationId, required: true, schema: { type: string, example: REG001 } }]
      responses: { '200': { description: Approved registration application } }
  /registration-applications/{applicationId}/reject:
    put:
      tags: [Auth]
      summary: Reject a registration application
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: applicationId, required: true, schema: { type: string, example: REG001 } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistrationRejection' }
      responses: { '200': { description: Rejected registration application } }
  /users:
    get:
      tags: [Auth]
      summary: List platform users
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Users } }
    post:
      tags: [Auth]
      summary: Create a platform user with a generated temporary password
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserSaveRequest' }
      responses: { '201': { description: Created user } }
  /users/{userId}:
    put:
      tags: [Auth]
      summary: Update a platform user and their scopes
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: userId, required: true, schema: { type: string, example: U004 } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserSaveRequest' }
      responses: { '200': { description: Updated user } }
  /users/{userId}/active:
    put:
      tags: [Auth]
      summary: Enable or disable a platform user
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: userId, required: true, schema: { type: string, example: U004 } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [active], properties: { active: { type: boolean } } }
      responses: { '200': { description: Updated user } }
  /users/{userId}/reset-password:
    post:
      tags: [Auth]
      summary: Reset a user password and return a temporary password
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: userId, required: true, schema: { type: string, example: U004 } }]
      responses: { '200': { description: Temporary password generated } }
  /farms:
    get:
      tags: [Farms]
      summary: 查询当前用户的农场
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 农场列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Farm' }
  /farms/{farmId}/overview:
    get:
      tags: [Farms]
      summary: 查询农场下所有地块的当前概况
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/FarmId'
      responses:
        '200':
          description: 地块、最新指标和设备状态
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PlotOverview' }
  /devices:
    get:
      tags: [Devices]
      summary: 查询设备
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: plotId
          schema: { type: string }
      responses:
        '200':
          description: 设备列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Device' }
    post:
      tags: [Devices]
      summary: 注册设备
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceCreateRequest' }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
  /devices/{deviceId}/commands:
    post:
      tags: [Commands]
      summary: 下发灌溉控制指令
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommandCreateRequest' }
      responses:
        '202':
          description: 指令已下发，等待设备结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Command' }
  /devices/{deviceId}/bind:
    post:
      tags: [Devices]
      summary: 将设备绑定到地块
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceBindRequest' }
      responses:
        '200':
          description: 绑定成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
    delete:
      tags: [Devices]
      summary: 解除设备绑定
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '204':
          description: 解绑成功
  /devices/{deviceId}/status:
    get:
      tags: [Devices]
      summary: 查询设备在线状态
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: 设备状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceStatus' }
  /commands/{commandId}:
    get:
      tags: [Commands]
      summary: 查询指令执行状态
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: commandId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 指令状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Command' }
  /plots/{plotId}/metrics:
    get:
      tags: [Telemetry]
      summary: 查询地块历史指标
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/PlotId'
        - in: query
          name: type
          required: true
          schema: { type: string, enum: [temperature, humidity] }
        - in: query
          name: from
          required: true
          schema: { type: string, format: date-time }
        - in: query
          name: to
          required: true
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: 时间序列数据
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MetricPoint' }
  /irrigation/records:
    get:
      tags: [Irrigation]
      summary: List irrigation command records for a plot
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: plotId
          required: true
          schema: { type: string, example: P001 }
      responses:
        '200':
          description: Irrigation records ordered from newest to oldest
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/IrrigationRecord' }
  /plots/{plotId}/irrigation-settings:
    get:
      tags: [Irrigation]
      summary: Get plot irrigation settings
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/PlotId' }]
      responses:
        '200':
          description: Current irrigation settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IrrigationSettings' }
    put:
      tags: [Irrigation]
      summary: Update plot irrigation settings
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/PlotId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IrrigationSettingsUpdate' }
      responses:
        '200':
          description: Saved irrigation settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IrrigationSettings' }
  /alerts:
    get:
      tags: [Alerts]
      summary: 查询告警记录
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: plotId
          schema: { type: string, example: P001 }
        - in: query
          name: status
          schema: { type: string, enum: [active, acknowledged, recovered] }
      responses:
        '200':
          description: 告警列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Alert' }
  /alert-rules:
    get:
      tags: [Alerts]
      summary: 查询告警规则
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: plotId
          schema: { type: string, example: P001 }
      responses:
        '200':
          description: 告警规则列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AlertRule' }
    post:
      tags: [Alerts]
      summary: 创建或更新阈值规则
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlertRuleRequest' }
      responses:
        '200':
          description: 保存成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertRule' }
  /alerts/{alertId}/ack:
    post:
      tags: [Alerts]
      summary: 确认告警
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: alertId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 确认成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alert' }
  /chat/sessions/{sessionId}/messages:
    post:
      tags: [Chat]
      summary: 向农业智能体提问
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string }
                plotId: { type: string, nullable: true }
      responses:
        '200':
          description: 智能体回答
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatReply' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    FarmId:
      in: path
      name: farmId
      required: true
      schema: { type: string, example: F001 }
    PlotId:
      in: path
      name: plotId
      required: true
      schema: { type: string, example: P001 }
    DeviceId:
      in: path
      name: deviceId
      required: true
      schema: { type: string, example: D003 }
  responses:
    Unauthorized:
      description: 未登录或令牌无效
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }
    LoginResponse:
      type: object
      required: [token, user]
      properties:
        token: { type: string }
        user: { $ref: '#/components/schemas/User' }
    User:
      type: object
      properties:
        id: { type: string, example: U001 }
        username: { type: string }
        role: { type: string, enum: [farmer, farm_admin, system_admin] }
    RegistrationRequest:
      type: object
      required: [username, password, real_name, role_codes]
      properties:
        username: { type: string }
        password: { type: string, format: password }
        real_name: { type: string }
        email: { type: string, format: email, nullable: true }
        phone: { type: string, nullable: true }
        role_codes: { type: array, items: { type: string, enum: [farmer, farm_admin] } }
        farm_ids: { type: array, items: { type: string, example: F001 } }
        plot_ids: { type: array, items: { type: string, example: P001 } }
    RegistrationRejection:
      type: object
      required: [reason]
      properties:
        reason: { type: string }
    RegistrationApplication:
      type: object
      properties:
        id: { type: string, example: REG001 }
        username: { type: string }
        realName: { type: string }
        roles: { type: array, items: { type: string } }
        farmIds: { type: array, items: { type: string } }
        plotIds: { type: array, items: { type: string } }
        status: { type: string, enum: [pending, approved, rejected] }
        createdAt: { type: string, format: date-time, description: UTC timestamp with a Z suffix }
        reviewedAt: { type: string, format: date-time, nullable: true, description: UTC timestamp with a Z suffix }
    UserSaveRequest:
      type: object
      required: [username, role_codes]
      properties:
        username: { type: string }
        name: { type: string, nullable: true }
        email: { type: string, format: email, nullable: true }
        phone: { type: string, nullable: true }
        active: { type: boolean }
        role_codes: { type: array, items: { type: string, enum: [farmer, farm_admin, system_admin] } }
        farm_ids: { type: array, items: { type: string } }
        plot_ids: { type: array, items: { type: string } }
    Farm:
      type: object
      properties:
        id: { type: string, example: F001 }
        name: { type: string }
    PlotOverview:
      type: object
      properties:
        plot: { $ref: '#/components/schemas/Plot' }
        latestMetrics:
          type: array
          items: { $ref: '#/components/schemas/MetricPoint' }
        devices:
          type: array
          items: { $ref: '#/components/schemas/Device' }
    Plot:
      type: object
      properties:
        id: { type: string, example: P001 }
        farmId: { type: string, example: F001 }
        name: { type: string }
    Device:
      type: object
      properties:
        id: { type: string, example: D001 }
        deviceNo: { type: string, example: P001-TEMP }
        deviceUuid: { type: string, format: uuid, example: 3b8dcefd-3a51-4adc-b452-47c184c0951d }
        type: { type: string, enum: [temperature, humidity, irrigation] }
        plotId: { type: string, example: P001, nullable: true }
        status: { type: string, enum: [online, offline] }
        lastSeenAt: { type: string, format: date-time, description: UTC 时间，始终带 Z 后缀 }
    DeviceCreateRequest:
      type: object
      required: [deviceNo, deviceUuid, type]
      properties:
        deviceNo: { type: string }
        deviceUuid: { type: string, format: uuid }
        type: { type: string, enum: [temperature, humidity, irrigation] }
        plotId: { type: string, nullable: true, description: 省略时注册为未绑定设备，仅系统管理员可操作 }
    DeviceBindRequest:
      type: object
      required: [plotId]
      properties:
        plotId: { type: string, example: P001 }
    DeviceStatus:
      type: object
      required: [deviceId, status]
      properties:
        deviceId: { type: string, example: D001 }
        status: { type: string, enum: [online, offline] }
        lastSeenAt: { type: string, format: date-time, description: UTC 时间，始终带 Z 后缀 }
    MetricPoint:
      type: object
      properties:
        type: { type: string, enum: [temperature, humidity] }
        value: { type: number, format: double }
        unit: { type: string, example: 'C' }
        ts: { type: string, format: date-time, description: UTC 时间，始终带 Z 后缀, example: '2026-08-25T06:04:21Z' }
    CommandCreateRequest:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [irrigation_on, irrigation_off] }
        activationType: { type: string, enum: [manual, auto] }
    Command:
      type: object
      properties:
        commandId: { type: string, example: '10001' }
        deviceId: { type: string, example: D003 }
        deviceUuid: { type: string, format: uuid }
        action: { type: string, enum: [irrigation_on, irrigation_off] }
        activationType: { type: string, enum: [manual, auto] }
        status: { type: string, enum: [pending, success, failed, timeout] }
        requestedAt: { type: string, format: date-time, description: UTC 时间，始终带 Z 后缀 }
        executedAt: { type: string, format: date-time, nullable: true, description: UTC 时间，始终带 Z 后缀 }
    IrrigationSettingsUpdate:
      type: object
      required: [irrigationDuration, irrigationInterval]
      properties:
        irrigationDuration: { type: integer, minimum: 0, maximum: 1440 }
        irrigationInterval: { type: integer, minimum: 0, maximum: 10080 }
    IrrigationSettings:
      allOf:
        - $ref: '#/components/schemas/IrrigationSettingsUpdate'
        - type: object
          properties:
            plotId: { type: string, example: P001 }
            updatedAt: { type: string, format: date-time, nullable: true, description: UTC timestamp with a Z suffix }
    IrrigationRecord:
      type: object
      properties:
        recordId: { type: string, example: IR001 }
        commandId: { type: string, nullable: true }
        plotId: { type: string, example: P001 }
        deviceId: { type: string, example: D003 }
        action: { type: string, enum: [irrigation_on, irrigation_off] }
        activationType: { type: string, enum: [manual, auto] }
        status: { type: string, enum: [pending, success, failed, timeout] }
        requestedAt: { type: string, format: date-time, description: UTC timestamp with a Z suffix }
        executedAt: { type: string, format: date-time, nullable: true, description: UTC timestamp with a Z suffix }
    AlertRuleRequest:
      type: object
      required: [plotId, soilMoistureThreshold]
      properties:
        plotId: { type: string, example: P001 }
        soilMoistureThreshold: { type: number, minimum: 0, maximum: 100 }
        irrigationLength: { type: integer, minimum: 0, default: 0 }
        irrigationInterval: { type: integer, minimum: 0, default: 0 }
    AlertRule:
      allOf:
        - $ref: '#/components/schemas/AlertRuleRequest'
        - type: object
          properties:
            id: { type: string }
            updatedAt: { type: string, format: date-time, description: UTC 时间，始终带 Z 后缀 }
    Alert:
      type: object
      properties:
        id: { type: string }
        plotId: { type: string }
        deviceId: { type: string, nullable: true }
        type: { type: string, enum: [low_moisture, device_offline, device_fault, irrigation_failed] }
        description: { type: string }
        value: { type: number, nullable: true }
        threshold: { type: number, nullable: true }
        status: { type: string, enum: [active, acknowledged, recovered] }
        triggeredAt: { type: string, format: date-time, description: UTC 时间，始终带 Z 后缀 }
        handledAt: { type: string, format: date-time, nullable: true, description: UTC 时间，始终带 Z 后缀 }
    ChatReply:
      type: object
      properties:
        sessionId: { type: string }
        answer: { type: string }
        sources:
          type: array
          items: { type: string }
