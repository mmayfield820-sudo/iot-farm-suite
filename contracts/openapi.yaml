openapi: 3.0.3
info:
  title: Smart Farm API
  version: 0.1.0
  description: 前端与后端之间的 REST API 契约。实现应与本文件保持一致。
servers:
  - url: http://localhost:8080/api
tags:
  - name: Auth
  - name: Farms
  - name: Devices
  - name: Telemetry
  - name: Commands
  - name: Alerts
  - name: Chat
paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: 用户登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /farms:
    get:
      tags: [Farms]
      summary: 查询当前用户的农场
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 农场列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Farm' }
  /farms/{farmId}/overview:
    get:
      tags: [Farms]
      summary: 查询农场下所有地块的当前概况
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/FarmId'
      responses:
        '200':
          description: 地块、最新指标和设备状态
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PlotOverview' }
  /devices:
    get:
      tags: [Devices]
      summary: 查询设备
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: plotId
          schema: { type: string }
      responses:
        '200':
          description: 设备列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Device' }
    post:
      tags: [Devices]
      summary: 注册设备
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceCreateRequest' }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
  /devices/{deviceId}/commands:
    post:
      tags: [Commands]
      summary: 下发灌溉控制指令
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommandCreateRequest' }
      responses:
        '202':
          description: 指令已下发，等待设备结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Command' }
  /devices/{deviceId}/bind:
    post:
      tags: [Devices]
      summary: 将设备绑定到地块
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceBindRequest' }
      responses:
        '200':
          description: 绑定成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
    delete:
      tags: [Devices]
      summary: 解除设备绑定
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '204':
          description: 解绑成功
  /devices/{deviceId}/status:
    get:
      tags: [Devices]
      summary: 查询设备在线状态
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: 设备状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceStatus' }
  /commands/{commandId}:
    get:
      tags: [Commands]
      summary: 查询指令执行状态
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: commandId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 指令状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Command' }
  /plots/{plotId}/metrics:
    get:
      tags: [Telemetry]
      summary: 查询地块历史指标
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/PlotId'
        - in: query
          name: type
          required: true
          schema: { type: string, enum: [temperature, humidity] }
        - in: query
          name: from
          required: true
          schema: { type: string, format: date-time }
        - in: query
          name: to
          required: true
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: 时间序列数据
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MetricPoint' }
  /alerts:
    get:
      tags: [Alerts]
      summary: 查询告警记录
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 告警列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Alert' }
  /alert-rules:
    get:
      tags: [Alerts]
      summary: 查询告警规则
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 告警规则列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AlertRule' }
    post:
      tags: [Alerts]
      summary: 创建或更新阈值规则
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlertRuleRequest' }
      responses:
        '200':
          description: 保存成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertRule' }
  /alerts/{alertId}/ack:
    post:
      tags: [Alerts]
      summary: 确认告警
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: alertId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 确认成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alert' }
  /chat/sessions/{sessionId}/messages:
    post:
      tags: [Chat]
      summary: 向农业智能体提问
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string }
                plotId: { type: string }
      responses:
        '200':
          description: 智能体回答
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatReply' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    FarmId:
      in: path
      name: farmId
      required: true
      schema: { type: string, example: F001 }
    PlotId:
      in: path
      name: plotId
      required: true
      schema: { type: string, example: P001 }
    DeviceId:
      in: path
      name: deviceId
      required: true
      schema: { type: string, example: D003 }
  responses:
    Unauthorized:
      description: 未登录或令牌无效
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }
    LoginResponse:
      type: object
      required: [token, user]
      properties:
        token: { type: string }
        user: { $ref: '#/components/schemas/User' }
    User:
      type: object
      properties:
        id: { type: string, example: U001 }
        username: { type: string }
        role: { type: string, enum: [farmer, farm_admin, system_admin] }
    Farm:
      type: object
      properties:
        id: { type: string, example: F001 }
        name: { type: string }
    PlotOverview:
      type: object
      properties:
        plot: { $ref: '#/components/schemas/Plot' }
        latestMetrics:
          type: array
          items: { $ref: '#/components/schemas/MetricPoint' }
        devices:
          type: array
          items: { $ref: '#/components/schemas/Device' }
    Plot:
      type: object
      properties:
        id: { type: string, example: P001 }
        farmId: { type: string, example: F001 }
        name: { type: string }
    Device:
      type: object
      properties:
        id: { type: string, example: D001 }
        deviceNo: { type: string, example: SENSOR-001 }
        mqttDeviceId: { type: string, example: device_001 }
        type: { type: string, enum: [temperature, humidity, irrigation] }
        plotId: { type: string, example: P001 }
        status: { type: string, enum: [online, offline] }
        lastSeenAt: { type: string, format: date-time }
    DeviceCreateRequest:
      type: object
      required: [deviceNo, mqttDeviceId, type, plotId]
      properties:
        deviceNo: { type: string }
        mqttDeviceId: { type: string }
        type: { type: string, enum: [temperature, humidity, irrigation] }
        plotId: { type: string }
    DeviceBindRequest:
      type: object
      required: [plotId]
      properties:
        plotId: { type: string, example: P001 }
    DeviceStatus:
      type: object
      required: [deviceId, status]
      properties:
        deviceId: { type: string, example: D001 }
        status: { type: string, enum: [online, offline] }
        lastSeenAt: { type: string, format: date-time }
    MetricPoint:
      type: object
      properties:
        type: { type: string, enum: [temperature, humidity] }
        value: { type: number, format: double }
        unit: { type: string, example: 'C' }
        ts: { type: string, format: date-time }
    CommandCreateRequest:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [irrigation_on, irrigation_off] }
    Command:
      type: object
      properties:
        commandId: { type: string, example: CMD0001 }
        deviceId: { type: string, example: D003 }
        action: { type: string, enum: [irrigation_on, irrigation_off] }
        status: { type: string, enum: [pending, success, failed, timeout] }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time, nullable: true }
    AlertRuleRequest:
      type: object
      required: [plotId, metricType, operator, threshold]
      properties:
        plotId: { type: string }
        metricType: { type: string, enum: [temperature, humidity] }
        operator: { type: string, enum: ['<', '>', '<=', '>='] }
        threshold: { type: number }
        enabled: { type: boolean, default: true }
    AlertRule:
      allOf:
        - $ref: '#/components/schemas/AlertRuleRequest'
        - type: object
          properties:
            id: { type: string }
    Alert:
      type: object
      properties:
        id: { type: string }
        plotId: { type: string }
        metricType: { type: string, enum: [temperature, humidity] }
        value: { type: number }
        threshold: { type: number }
        status: { type: string, enum: [active, acknowledged, recovered] }
        triggeredAt: { type: string, format: date-time }
    ChatReply:
      type: object
      properties:
        sessionId: { type: string }
        answer: { type: string }
        sources:
          type: array
          items: { type: string }
