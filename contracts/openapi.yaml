openapi: 3.0.3
info:
  title: Orange Heart Ruyi API
  version: 2.0.0
  description: 前端与后端之间的 REST API 契约。实现应与本文件保持一致。
servers:
  - url: http://localhost:8080/api
tags:
  - name: Auth
  - name: Auth
  - name: Users
  - name: Farms
  - name: Templates
  - name: Tasks
  - name: Plots
  - name: Devices
  - name: Telemetry
  - name: Commands
  - name: Alerts
  - name: Irrigation
  - name: Audit
  - name: Chat
paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: 用户登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/first-login/complete:
    post:
      tags: [Auth]
      summary: Complete first login and set a permanent password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FirstLoginCompleteRequest' }
      responses:
        '200':
          description: Permanent password set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
  /users:
    get:
      tags: [Users]
      summary: List pre-provisioned employees
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: pageSize, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { in: query, name: keyword, schema: { type: string } }
        - { in: query, name: role, schema: { type: string, enum: [farmer, farm_admin, system_admin] } }
        - { in: query, name: status, schema: { type: string, enum: [pending_activation, active, disabled] } }
      responses:
        '200':
          description: Employee page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPage' }
    post:
      tags: [Users]
      summary: Create a pre-provisioned employee account
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserCreateRequest' }
      responses:
        '201':
          description: Pending first-login account created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
  /users/{userId}:
    patch:
      tags: [Users]
      summary: Update an employee, roles, or scopes
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: userId, required: true, schema: { type: string, example: U004 } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdateRequest' }
      responses:
        '200':
          description: Updated employee
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
  /users/{userId}/status:
    patch:
      tags: [Users]
      summary: Enable or disable an employee account
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: userId, required: true, schema: { type: string, example: U004 } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserStatusUpdateRequest' }
      responses:
        '200':
          description: Updated employee
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
  /users/{userId}/initial-password/reset:
    post:
      tags: [Users]
      summary: Reset the initial password to the last six ID-card characters
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: userId, required: true, schema: { type: string, example: U004 } }]
      responses:
        '200':
          description: Account returned to pending first-login state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InitialPasswordResetResponse' }
  /crop-templates:
    get:
      tags: [Templates]
      summary: List published crop template versions
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: crop, schema: { type: string } }
        - { in: query, name: province, schema: { type: string } }
        - { in: query, name: city, schema: { type: string } }
      responses:
        '200':
          description: Templates
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/CropTemplate' } }
    post:
      tags: [Templates]
      summary: Create a template with its first published version
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TemplateCreateRequest' }
      responses:
        '201':
          description: Published first version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CropTemplate' }
  /crop-templates/{templateId}/drafts:
    post:
      tags: [Templates]
      summary: Farm administrator clones an authorized farm's current version into a next-cycle draft
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: templateId, required: true, schema: { type: string, example: CT001 } }
        - { in: query, name: farmId, required: true, schema: { type: string, example: F001 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TemplateDraftCreateRequest' }
      responses:
        '201':
          description: Farm-scoped draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplateDraft' }
        '409': { description: Maintenance window closed or draft already exists }
  /farms/{farmId}/cycle-draft:
    get:
      tags: [Farms]
      summary: Farm administrator gets the current authorized farm's unpublished next-cycle draft
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/FarmId' }]
      responses:
        '200':
          description: Current farm-scoped next-cycle draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplateDraft' }
        '404': { description: No next-cycle draft exists for the farm }
        '403': { description: Farm administrator permission for this farm is required }
  /crop-template-drafts/{draftId}:
    put:
      tags: [Templates]
      summary: Farm administrator replaces an authorized unpublished farm draft's definition
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: draftId, required: true, schema: { type: string, example: CTV002 } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TemplateDraftUpdateRequest' }
      responses:
        '200':
          description: Updated draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplateDraft' }
  /crop-template-drafts/{draftId}/publish:
    post:
      tags: [Templates]
      summary: Farm administrator publishes an authorized farm draft and assigns it as that farm's next-cycle version
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: draftId, required: true, schema: { type: string, example: CTV002 } }]
      responses:
        '200':
          description: Published version assigned to the farm
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplatePublishResult' }
        '409': { description: Maintenance window closed }
  /tasks:
    get:
      tags: [Tasks]
      summary: List visible tasks by today, overdue, next seven days, or month
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: scope, schema: { type: string, enum: [today, overdue, next7days, month], default: today } }
        - { in: query, name: plotId, schema: { type: string, example: P001 } }
        - { in: query, name: status, schema: { type: string, enum: [pending, in_progress, completed, overdue, cancelled] } }
        - { in: query, name: month, schema: { type: string, example: '2026-08' } }
      responses:
        '200':
          description: Tasks in the current user's scope
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ManagementTask' } }
  /tasks/{taskId}:
    get:
      tags: [Tasks]
      summary: Get a task with its completion and adjustment history
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: taskId, required: true, schema: { type: string, example: MT001 } }]
      responses:
        '200':
          description: Task detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagementTaskDetail' }
    patch:
      tags: [Tasks]
      summary: Farmer adjusts an assigned unfinished task
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: taskId, required: true, schema: { type: string, example: MT001 } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskUpdateRequest' }
      responses:
        '200':
          description: Adjusted task
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagementTask' }
        '409': { description: Completed, cancelled, or superseded task cannot be adjusted }
  /tasks/{taskId}/completions:
    post:
      tags: [Tasks]
      summary: Farmer records completion of an assigned task
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: taskId, required: true, schema: { type: string, example: MT001 } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskCompletionRequest' }
      responses:
        '201':
          description: Completed task
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagementTask' }
  /plots/{plotId}/ad-hoc-tasks:
    post:
      tags: [Tasks]
      summary: Farmer records completed work outside a generated plan
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/PlotId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdHocTaskRequest' }
      responses:
        '201':
          description: Completed ad-hoc task
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagementTask' }
  /farms/{farmId}/plans:
    post:
      tags: [Farms]
      summary: Farm administrator generates immutable plan snapshots for every active plot in an authorized farm
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/FarmId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FarmPlanGenerateRequest' }
      responses:
        '201':
          description: Plans generated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FarmPlanGenerationResult' }
        '409': { description: Farm production profile is missing or an active plan exists }
  /farms/{farmId}/production-profile:
    get:
      tags: [Farms]
      summary: Get the farm-wide production cycle profile
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/FarmId' }]
      responses:
        '200':
          description: Current production profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FarmProductionProfile' }
        '404': { description: Production profile has not been set }
    put:
      tags: [Farms]
      summary: Farm administrator sets an authorized farm's production cycle and published template version
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/FarmId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FarmProductionProfileRequest' }
      responses:
        '200':
          description: Production profile saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FarmProductionProfile' }
  /plots/{plotId}/production-context:
    get:
      tags: [Plots]
      summary: Get the authorized plot's current farm-cycle context and growth stage
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/PlotId' }]
      responses:
        '200':
          description: Current production context used to explain planned tasks
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlotProductionContext' }
        '404': { description: Plot or farm production profile not found }
  /audit-logs:
    get:
      tags: [Audit]
      summary: List key operation audit logs
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: pageSize, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { in: query, name: module, schema: { type: string, enum: [master_data, account_access, production_plan, task_execution, irrigation, device_binding] } }
        - { in: query, name: keyword, schema: { type: string } }
      responses:
        '200':
          description: System-administrator audit-log page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditLogPage' }
  /farms:
    get:
      tags: [Farms]
      summary: List farms visible to the current user
      security: [{ bearerAuth: [] }]
      parameters: [{ in: query, name: status, schema: { type: string, enum: [active, inactive] } }]
      responses:
        '200':
          description: Farms
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Farm' } }
    post:
      tags: [Farms]
      summary: Create a farm
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FarmSaveRequest' }
      responses:
        '201':
          description: Farm created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Farm' }
  /farms/{farmId}:
    get:
      tags: [Farms]
      summary: Get a farm
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/FarmId' }]
      responses:
        '200':
          description: Farm
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Farm' }
    patch:
      tags: [Farms]
      summary: Update or deactivate a farm
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/FarmId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FarmUpdateRequest' }
      responses:
        '200':
          description: Farm updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Farm' }
  /farms/{farmId}/overview:
    get:
      tags: [Farms]
      summary: Get current plot overview for a farm
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/FarmId' }]
      responses:
        '200':
          description: Plot overview
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/PlotOverview' } }
  /farms/{farmId}/management-statistics:
    get:
      tags: [Farms]
      summary: Get management statistics for each plot in a farm
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/FarmId' }]
      responses:
        '200':
          description: Per-plot pending reminders, active-plan completion, and latest irrigation
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FarmManagementStatistic' }
  /plots:
    get:
      tags: [Plots]
      summary: List visible plots
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: pageSize, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { in: query, name: farmId, schema: { type: string, example: F001 } }
        - { in: query, name: keyword, schema: { type: string } }
        - { in: query, name: status, schema: { type: string, enum: [active, inactive] } }
      responses:
        '200':
          description: Plot page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlotPage' }
    post:
      tags: [Plots]
      summary: Create a plot
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlotSaveRequest' }
      responses:
        '201':
          description: Plot created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plot' }
  /plots/{plotId}:
    get:
      tags: [Plots]
      summary: Get a plot
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/PlotId' }]
      responses:
        '200':
          description: Plot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plot' }
    patch:
      tags: [Plots]
      summary: Update or deactivate a plot
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/PlotId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlotUpdateRequest' }
      responses:
        '200':
          description: Plot updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plot' }
  /plots/{plotId}/devices:
    get:
      tags: [Plots]
      summary: List devices attached to a plot
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/PlotId' }]
      responses:
        '200':
          description: Devices
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Device' } }
  /devices:
    get:
      tags: [Devices]
      summary: 查询设备
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: plotId
          schema: { type: string }
      responses:
        '200':
          description: 设备列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Device' }
    post:
      tags: [Devices]
      summary: 注册设备
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceCreateRequest' }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
  /devices/{deviceId}/commands:
    post:
      tags: [Commands]
      summary: 下发灌溉控制指令
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommandCreateRequest' }
      responses:
        '202':
          description: 指令已下发，等待设备结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Command' }
  /devices/{deviceId}/bind:
    post:
      tags: [Devices]
      summary: 将设备绑定到地块
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceBindRequest' }
      responses:
        '200':
          description: 绑定成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
    delete:
      tags: [Devices]
      summary: 解除设备绑定
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '204':
          description: 解绑成功
  /devices/{deviceId}/status:
    get:
      tags: [Devices]
      summary: 查询设备在线状态
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: 设备状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceStatus' }
  /commands/{commandId}:
    get:
      tags: [Commands]
      summary: 查询指令执行状态
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: commandId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 指令状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Command' }
  /plots/{plotId}/metrics:
    get:
      tags: [Telemetry]
      summary: 查询地块历史指标
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/PlotId'
        - in: query
          name: type
          required: true
          schema: { type: string, enum: [temperature, humidity] }
        - in: query
          name: from
          required: true
          schema: { type: string, format: date-time }
        - in: query
          name: to
          required: true
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: 时间序列数据
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MetricPoint' }
  /plots/{plotId}/management-history:
    get:
      tags: [Plots]
      summary: List a plot's management history
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/PlotId'
        - in: query
          name: from
          required: true
          schema: { type: string, format: date-time }
        - in: query
          name: to
          required: true
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Chronological management events for the selected time range
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlotManagementHistory' }
  /irrigation/records:
    get:
      tags: [Irrigation]
      summary: List irrigation command records for a plot
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: plotId
          required: true
          schema: { type: string, example: P001 }
      responses:
        '200':
          description: Irrigation records ordered from newest to oldest
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/IrrigationRecord' }
  /plots/{plotId}/irrigation-settings:
    get:
      tags: [Irrigation]
      summary: Get plot irrigation settings
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/PlotId' }]
      responses:
        '200':
          description: Current irrigation settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IrrigationSettings' }
    put:
      tags: [Irrigation]
      summary: Update plot irrigation settings
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/PlotId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IrrigationSettingsUpdate' }
      responses:
        '200':
          description: Saved irrigation settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IrrigationSettings' }
  /alerts:
    get:
      tags: [Alerts]
      summary: 查询告警记录
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: plotId
          schema: { type: string, example: P001 }
        - in: query
          name: status
          schema: { type: string, enum: [active, acknowledged, recovered] }
      responses:
        '200':
          description: 告警列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Alert' }
  /plan-adjustment-reminders:
    get:
      tags: [Alerts]
      summary: 查询计划调整提醒
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: plotId
          schema: { type: string, example: P001 }
        - in: query
          name: status
          schema: { type: string, enum: [active, recovered], default: active }
      responses:
        '200':
          description: 计划调整提醒列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PlanAdjustmentReminder' }
  /plan-adjustment-reminders/{reminderId}/disposition:
    post:
      tags: [Alerts]
      summary: 处置计划调整提醒
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: reminderId
          required: true
          schema: { type: string, example: PR001 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanAdjustmentReminderDispositionRequest' }
      responses:
        '200':
          description: 处置已记录
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanAdjustmentReminder' }
  /alert-rules:
    get:
      tags: [Alerts]
      summary: 查询告警规则
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: plotId
          schema: { type: string, example: P001 }
      responses:
        '200':
          description: 告警规则列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AlertRule' }
    post:
      tags: [Alerts]
      summary: 创建或更新阈值规则
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlertRuleRequest' }
      responses:
        '200':
          description: 保存成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertRule' }
  /alerts/{alertId}/ack:
    post:
      tags: [Alerts]
      summary: 确认告警
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: alertId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 确认成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alert' }
  /chat/sessions/{sessionId}/messages:
    post:
      tags: [Chat]
      summary: 向农业智能体提问
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string }
                plotId: { type: string, nullable: true }
      responses:
        '200':
          description: 智能体回答
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatReply' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    FarmId:
      in: path
      name: farmId
      required: true
      schema: { type: string, example: F001 }
    PlotId:
      in: path
      name: plotId
      required: true
      schema: { type: string, example: P001 }
    DeviceId:
      in: path
      name: deviceId
      required: true
      schema: { type: string, example: D003 }
  responses:
    Unauthorized:
      description: 未登录或令牌无效
  schemas:
    AuditLog:
      type: object
      required: [id, occurredAt, actorName, module, action]
      properties:
        id: { type: string, example: AL001 }
        occurredAt: { type: string, format: date-time, description: UTC timestamp with a Z suffix }
        actorName: { type: string }
        actorEmployeeNo: { type: string, nullable: true }
        module: { type: string, enum: [master_data, account_access, production_plan, task_execution, irrigation, device_binding] }
        action: { type: string }
        targetType: { type: string, nullable: true }
        targetId: { type: string, nullable: true }
        detail: { type: string, nullable: true }
    AuditLogPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AuditLog' } }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
    LoginRequest:
      type: object
      required: [employeeNo, password]
      properties:
        employeeNo: { type: string, description: Unique employee number used for login. }
        password: { type: string, format: password, description: First login uses the last six ID-card characters. }
    LoginResponse:
      type: object
      properties:
        token: { type: string, description: Returned after regular login only. }
        user: { $ref: '#/components/schemas/User' }
        requiresProfileCompletion: { type: boolean }
        profileSetupToken: { type: string, description: Short-lived and valid only for first-login completion. }
    FirstLoginCompleteRequest:
      type: object
      required: [profileSetupToken, password]
      properties:
        profileSetupToken: { type: string }
        password: { type: string, format: password, minLength: 6, maxLength: 72 }
        phone: { type: string, nullable: true, maxLength: 20 }
        email: { type: string, format: email, nullable: true, maxLength: 100 }
    User:
      type: object
      required: [id, employeeNo, name, roleCodes, status, farmIds, plotIds]
      properties:
        id: { type: string, example: U001 }
        employeeNo: { type: string, example: E2026001 }
        idCardMasked: { type: string, nullable: true, example: '500236********1234' }
        name: { type: string, example: Zhang San }
        phone: { type: string, nullable: true }
        email: { type: string, format: email, nullable: true }
        role: { type: string, nullable: true, enum: [farmer, farm_admin, system_admin] }
        roleCodes: { type: array, items: { type: string, enum: [farmer, farm_admin, system_admin] } }
        farmIds: { type: array, items: { type: string, example: F001 } }
        plotIds: { type: array, items: { type: string, example: P001 } }
        status: { type: string, enum: [pending_activation, active, disabled] }
        activatedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    UserCreateRequest:
      type: object
      required: [employeeNo, idCardNo, name, roleCodes]
      properties:
        employeeNo: { type: string, minLength: 1, maxLength: 50 }
        idCardNo: { type: string, minLength: 15, maxLength: 18, description: Plaintext is accepted only for the request and never stored. }
        name: { type: string, minLength: 1, maxLength: 50 }
        email: { type: string, format: email, nullable: true }
        phone: { type: string, nullable: true }
        roleCodes: { type: array, minItems: 1, items: { type: string, enum: [farmer, farm_admin, system_admin] } }
        farmIds: { type: array, items: { type: string, example: F001 } }
        plotIds: { type: array, items: { type: string, example: P001 } }
    UserUpdateRequest:
      type: object
      properties:
        idCardNo: { type: string, minLength: 15, maxLength: 18, description: Updating it resets the account to pending first-login completion. }
        name: { type: string, minLength: 1, maxLength: 50 }
        email: { type: string, format: email, nullable: true }
        phone: { type: string, nullable: true }
        roleCodes: { type: array, minItems: 1, items: { type: string, enum: [farmer, farm_admin, system_admin] } }
        farmIds: { type: array, items: { type: string, example: F001 } }
        plotIds: { type: array, items: { type: string, example: P001 } }
    UserStatusUpdateRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [active, disabled] }
    InitialPasswordResetResponse:
      type: object
      required: [userId, status]
      properties:
        userId: { type: string, example: U004 }
        status: { type: string, enum: [pending_activation] }
    UserPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/User' } }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
    TemplateTask:
      type: object
      properties:
        type: { type: string, maxLength: 50 }
        title: { type: string, maxLength: 150 }
        offsetDays: { type: integer, minimum: 0 }
        suggestedTime: { type: string, nullable: true, example: '08:00:00' }
        note: { type: string, nullable: true, maxLength: 1000 }
    TemplateStage:
      type: object
      required: [code, name, durationDays]
      properties:
        code: { type: string, maxLength: 50 }
        name: { type: string, maxLength: 100 }
        durationDays: { type: integer, minimum: 1 }
        moistureMin: { type: number, nullable: true }
        moistureMax: { type: number, nullable: true }
        managementFocus: { type: string, nullable: true }
        tasks: { type: array, items: { $ref: '#/components/schemas/TemplateTask' } }
    TemplateDefinition:
      type: object
      required: [stages]
      properties:
        stages: { type: array, minItems: 1, items: { $ref: '#/components/schemas/TemplateStage' } }
    TemplateCreateRequest:
      type: object
      required: [name, crop, versionDefinition]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        crop: { type: string, minLength: 1, maxLength: 50 }
        province: { type: string, nullable: true }
        city: { type: string, nullable: true }
        versionDefinition: { $ref: '#/components/schemas/TemplateDefinition' }
    TemplateDraftCreateRequest:
      type: object
      properties:
        changeNote: { type: string, nullable: true, maxLength: 500 }
    TemplateDraftUpdateRequest:
      type: object
      required: [versionDefinition]
      properties:
        versionDefinition: { $ref: '#/components/schemas/TemplateDefinition' }
        changeNote: { type: string, nullable: true, maxLength: 500 }
    CropTemplate:
      type: object
      required: [id, versionId, versionNo, status]
      properties:
        id: { type: string, example: CT001 }
        name: { type: string }
        crop: { type: string }
        province: { type: string, nullable: true }
        city: { type: string, nullable: true }
        versionId: { type: string, example: CTV001 }
        versionNo: { type: integer }
        status: { type: string, enum: [published] }
    TemplateDraft:
      type: object
      required: [id, templateId, farmId, versionNo, status, versionDefinition]
      properties:
        id: { type: string, example: CTV002 }
        templateId: { type: string, example: CT001 }
        farmId: { type: string, example: F001 }
        versionNo: { type: integer }
        status: { type: string, enum: [draft] }
        changeNote: { type: string, nullable: true }
        versionDefinition: { $ref: '#/components/schemas/TemplateDefinition' }
    TemplatePublishResult:
      type: object
      required: [id, templateId, farmId, status, publishedAt]
      properties:
        id: { type: string, example: CTV002 }
        templateId: { type: string, example: CT001 }
        farmId: { type: string, example: F001 }
        status: { type: string, enum: [published] }
        publishedAt: { type: string, format: date-time }
    TaskCompletion:
      type: object
      properties:
        id: { type: string, example: TC001 }
        result: { type: string }
        executedAt: { type: string, format: date-time }
        executorUserId: { type: string, example: U001 }
        executorName: { type: string }
        note: { type: string, nullable: true }
        irrigationRecordId: { type: string, nullable: true, example: IR001 }
    ManagementTask:
      type: object
      required: [id, plotId, taskType, title, source, scheduledDate, status]
      properties:
        id: { type: string, example: MT001 }
        planId: { type: string, nullable: true, example: MP001 }
        plotId: { type: string, example: P001 }
        plotName: { type: string }
        stageCode: { type: string, nullable: true }
        taskType: { type: string }
        title: { type: string }
        source: { type: string, enum: [template, ad_hoc] }
        scheduledDate: { type: string, format: date }
        status: { type: string, enum: [pending, in_progress, completed, overdue, cancelled] }
        note: { type: string, nullable: true }
        updatedAt: { type: string, format: date-time }
        completion: { allOf: [{ $ref: '#/components/schemas/TaskCompletion' }], nullable: true }
    TaskAdjustment:
      type: object
      properties:
        id: { type: string, example: TA001 }
        changedBy: { type: string, example: U001 }
        type: { type: string }
        before: { type: object }
        after: { type: object }
        createdAt: { type: string, format: date-time }
    ManagementTaskDetail:
      allOf:
        - $ref: '#/components/schemas/ManagementTask'
        - type: object
          properties:
            adjustments: { type: array, items: { $ref: '#/components/schemas/TaskAdjustment' } }
    TaskUpdateRequest:
      type: object
      properties:
        scheduledDate: { type: string, format: date }
        note: { type: string, nullable: true, maxLength: 1000 }
        status: { type: string, enum: [pending, in_progress, cancelled] }
    TaskCompletionRequest:
      type: object
      required: [result, executedAt, executorName]
      properties:
        result: { type: string, maxLength: 255 }
        executedAt: { type: string, format: date-time, description: UTC offset required. }
        executorName: { type: string, maxLength: 50 }
        note: { type: string, nullable: true, maxLength: 1000 }
        irrigationRecordId: { type: string, nullable: true, example: IR001 }
    AdHocTaskRequest:
      type: object
      required: [taskType, title, executedAt, executorName]
      properties:
        taskType: { type: string, maxLength: 50 }
        title: { type: string, maxLength: 150 }
        executedAt: { type: string, format: date-time, description: UTC offset required. }
        executorName: { type: string, maxLength: 50 }
        note: { type: string, nullable: true, maxLength: 1000 }
        irrigationRecordId: { type: string, nullable: true, example: IR001 }
    FarmPlanGenerateRequest:
      type: object
      properties:
        regenerate: { type: boolean, default: false, description: Replace active plans with new snapshots. }
    GeneratedPlan:
      type: object
      required: [id, plotId, taskCount]
      properties:
        id: { type: string, example: MP001 }
        plotId: { type: string, example: P001 }
        taskCount: { type: integer, minimum: 0 }
    FarmPlanGenerationResult:
      type: object
      required: [farmId, templateVersionId, regenerated, plans, taskCount]
      properties:
        farmId: { type: string, example: F001 }
        templateVersionId: { type: string, example: CTV001 }
        regenerated: { type: boolean }
        plans: { type: array, items: { $ref: '#/components/schemas/GeneratedPlan' } }
        taskCount: { type: integer, minimum: 0 }
    FarmProductionProfileRequest:
      type: object
      required: [templateVersionId, plantingDate]
      properties:
        templateVersionId: { type: string, example: CTV001 }
        plantingDate: { type: string, format: date }
        treeAgeYears: { type: number, nullable: true, minimum: 0 }
        harvestCleanupCompletedAt: { type: string, format: date-time, nullable: true }
        nextCycleStartsOn: { type: string, format: date, nullable: true }
        note: { type: string, nullable: true, maxLength: 1000 }
    FarmProductionProfile:
      type: object
      required: [farmId, templateVersionId, plantingDate]
      properties:
        farmId: { type: string, example: F001 }
        templateVersionId: { type: string, example: CTV001 }
        plantingDate: { type: string, format: date }
        nextCycleStartsOn: { type: string, format: date, nullable: true }
    ProductionStageContext:
      type: object
      required: [code, name, startsOn, endsOn]
      properties:
        code: { type: string }
        name: { type: string }
        startsOn: { type: string, format: date }
        endsOn: { type: string, format: date }
        managementFocus: { type: string, nullable: true }
        moistureMin: { type: number, nullable: true }
        moistureMax: { type: number, nullable: true }
    PlotProductionContext:
      type: object
      required: [plotId, farmId, templateVersionId, templateName, crop, versionNo, plantingDate, cycleStatus]
      properties:
        plotId: { type: string, example: P001 }
        farmId: { type: string, example: F001 }
        templateVersionId: { type: string, example: CTV001 }
        templateName: { type: string }
        crop: { type: string }
        versionNo: { type: integer }
        plantingDate: { type: string, format: date }
        cycleStatus: { type: string, enum: [not_started, active, completed] }
        stage:
          allOf: [{ $ref: '#/components/schemas/ProductionStageContext' }]
          nullable: true
    Farm:
      type: object
      required: [id, name, province, city, status]
      properties:
        id: { type: string, example: F001 }
        name: { type: string }
        province: { type: string }
        city: { type: string }
        address: { type: string, nullable: true }
        areaMu: { type: number, nullable: true, minimum: 0 }
        managerName: { type: string, nullable: true }
        note: { type: string, nullable: true }
        status: { type: string, enum: [active, inactive] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    FarmSaveRequest:
      type: object
      required: [name, province, city]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        province: { type: string, minLength: 1, maxLength: 50 }
        city: { type: string, minLength: 1, maxLength: 50 }
        address: { type: string, nullable: true }
        areaMu: { type: number, nullable: true, minimum: 0 }
        managerName: { type: string, nullable: true }
        note: { type: string, nullable: true }
    FarmUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/FarmSaveRequest'
        - type: object
          properties:
            status: { type: string, enum: [active, inactive] }
    LatestIrrigation:
      type: object
      required: [recordId, action, activationType, status, requestedAt]
      properties:
        recordId: { type: string, example: IR001 }
        action: { type: string, enum: [irrigation_on, irrigation_off] }
        activationType: { type: string, enum: [manual, auto] }
        status: { type: string, enum: [pending, success, failed, timeout] }
        requestedAt: { type: string, format: date-time, description: UTC timestamp with a Z suffix }
        executedAt: { type: string, format: date-time, nullable: true, description: UTC timestamp with a Z suffix }
    FarmManagementStatistic:
      type: object
      required: [plotId, plotName, pendingReminderCount, taskTotal, completedTaskCount, pendingTaskCount, overdueTaskCount, taskCompletionRate, latestIrrigation]
      properties:
        plotId: { type: string, example: P001 }
        plotName: { type: string }
        pendingReminderCount: { type: integer, minimum: 0 }
        taskTotal: { type: integer, minimum: 0, description: Tasks in the current active plan. }
        completedTaskCount: { type: integer, minimum: 0 }
        pendingTaskCount: { type: integer, minimum: 0, description: Uncompleted tasks scheduled today or later. }
        overdueTaskCount: { type: integer, minimum: 0, description: Uncompleted tasks scheduled before today. }
        taskCompletionRate: { type: number, minimum: 0, maximum: 100 }
        latestIrrigation:
          allOf: [{ $ref: '#/components/schemas/LatestIrrigation' }]
          nullable: true
    PlotOverview:
      type: object
      properties:
        plot: { $ref: '#/components/schemas/Plot' }
        latestMetrics: { type: array, items: { $ref: '#/components/schemas/MetricPoint' } }
        devices: { type: array, items: { $ref: '#/components/schemas/Device' } }
    Plot:
      type: object
      required: [id, farmId, code, name, status]
      properties:
        id: { type: string, example: P001 }
        farmId: { type: string, example: F001 }
        code: { type: string, example: FJ-001 }
        name: { type: string }
        areaMu: { type: number, nullable: true, minimum: 0 }
        location: { type: string, nullable: true }
        irrigationMethod: { type: string, nullable: true, enum: [drip, sprinkler, flood, manual, other] }
        status: { type: string, enum: [active, inactive] }
        farmerUserId: { type: string, nullable: true }
        farmerName: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PlotSaveRequest:
      type: object
      required: [farmId, code, name]
      properties:
        farmId: { type: string, example: F001 }
        code: { type: string, minLength: 1, maxLength: 50 }
        name: { type: string, minLength: 1, maxLength: 100 }
        areaMu: { type: number, nullable: true, minimum: 0 }
        location: { type: string, nullable: true }
        irrigationMethod: { type: string, nullable: true, enum: [drip, sprinkler, flood, manual, other] }
        status: { type: string, enum: [active, inactive], default: active }
    PlotUpdateRequest:
      type: object
      properties:
        farmId: { type: string, example: F001 }
        code: { type: string, minLength: 1, maxLength: 50 }
        name: { type: string, minLength: 1, maxLength: 100 }
        areaMu: { type: number, nullable: true, minimum: 0 }
        location: { type: string, nullable: true }
        irrigationMethod: { type: string, nullable: true, enum: [drip, sprinkler, flood, manual, other] }
        status: { type: string, enum: [active, inactive] }
    PlotPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Plot' } }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
    Device:
      type: object
      properties:
        id: { type: string, example: D001 }
        deviceNo: { type: string, example: P001-TEMP }
        deviceUuid: { type: string, format: uuid, example: 3b8dcefd-3a51-4adc-b452-47c184c0951d }
        type: { type: string, enum: [temperature, humidity, irrigation] }
        plotId: { type: string, example: P001, nullable: true }
        status: { type: string, enum: [online, offline] }
        lastSeenAt: { type: string, format: date-time, description: UTC 时间，始终带 Z 后缀 }
    DeviceCreateRequest:
      type: object
      required: [deviceNo, deviceUuid, type]
      properties:
        deviceNo: { type: string }
        deviceUuid: { type: string, format: uuid }
        type: { type: string, enum: [temperature, humidity, irrigation] }
        plotId: { type: string, nullable: true, description: 省略时注册为未绑定设备，仅系统管理员可操作 }
    DeviceBindRequest:
      type: object
      required: [plotId]
      properties:
        plotId: { type: string, example: P001 }
    DeviceStatus:
      type: object
      required: [deviceId, status]
      properties:
        deviceId: { type: string, example: D001 }
        status: { type: string, enum: [online, offline] }
        lastSeenAt: { type: string, format: date-time, description: UTC 时间，始终带 Z 后缀 }
    MetricPoint:
      type: object
      properties:
        type: { type: string, enum: [temperature, humidity] }
        value: { type: number, format: double }
        unit: { type: string, example: 'C' }
        ts: { type: string, format: date-time, description: UTC 时间，始终带 Z 后缀, example: '2026-08-25T06:04:21Z' }
    CommandCreateRequest:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [irrigation_on, irrigation_off] }
        activationType: { type: string, enum: [manual, auto] }
    Command:
      type: object
      properties:
        commandId: { type: string, example: '10001' }
        deviceId: { type: string, example: D003 }
        deviceUuid: { type: string, format: uuid }
        action: { type: string, enum: [irrigation_on, irrigation_off] }
        activationType: { type: string, enum: [manual, auto] }
        status: { type: string, enum: [pending, success, failed, timeout] }
        requestedAt: { type: string, format: date-time, description: UTC 时间，始终带 Z 后缀 }
        executedAt: { type: string, format: date-time, nullable: true, description: UTC 时间，始终带 Z 后缀 }
    IrrigationSettingsUpdate:
      type: object
      required: [irrigationDuration, irrigationInterval]
      properties:
        irrigationDuration: { type: integer, minimum: 0, maximum: 1440 }
        irrigationInterval: { type: integer, minimum: 0, maximum: 10080 }
    IrrigationSettings:
      allOf:
        - $ref: '#/components/schemas/IrrigationSettingsUpdate'
        - type: object
          properties:
            plotId: { type: string, example: P001 }
            updatedAt: { type: string, format: date-time, nullable: true, description: UTC timestamp with a Z suffix }
    IrrigationRecord:
      type: object
      properties:
        recordId: { type: string, example: IR001 }
        commandId: { type: string, nullable: true }
        plotId: { type: string, example: P001 }
        deviceId: { type: string, example: D003 }
        action: { type: string, enum: [irrigation_on, irrigation_off] }
        activationType: { type: string, enum: [manual, auto] }
        status: { type: string, enum: [pending, success, failed, timeout] }
        requestedAt: { type: string, format: date-time, description: UTC timestamp with a Z suffix }
        executedAt: { type: string, format: date-time, nullable: true, description: UTC timestamp with a Z suffix }
    PlotManagementEvent:
      type: object
      required: [id, type, occurredAt, title, description, status, referenceId]
      properties:
        id: { type: string, example: 'task:MT001' }
        type: { type: string, enum: [plan_task, task_completion, irrigation, alert] }
        occurredAt: { type: string, format: date-time, description: UTC timestamp with a Z suffix }
        title: { type: string }
        description: { type: string }
        status: { type: string }
        referenceId: { type: string, example: MT001 }
    PlotManagementHistory:
      type: object
      required: [plotId, from, to, events]
      properties:
        plotId: { type: string, example: P001 }
        from: { type: string, format: date-time, description: UTC timestamp with a Z suffix }
        to: { type: string, format: date-time, description: UTC timestamp with a Z suffix }
        events:
          type: array
          items: { $ref: '#/components/schemas/PlotManagementEvent' }
    AlertRuleRequest:
      type: object
      required: [plotId, soilMoistureThreshold]
      properties:
        plotId: { type: string, example: P001 }
        soilMoistureThreshold: { type: number, minimum: 0, maximum: 100 }
        irrigationLength: { type: integer, minimum: 0, default: 0 }
        irrigationInterval: { type: integer, minimum: 0, default: 0 }
    AlertRule:
      allOf:
        - $ref: '#/components/schemas/AlertRuleRequest'
        - type: object
          properties:
            id: { type: string }
            updatedAt: { type: string, format: date-time, description: UTC 时间，始终带 Z 后缀 }
    Alert:
      type: object
      properties:
        id: { type: string }
        plotId: { type: string }
        deviceId: { type: string, nullable: true }
        type: { type: string, enum: [low_moisture, high_moisture, device_offline, device_fault, irrigation_failed] }
        description: { type: string }
        value: { type: number, nullable: true }
        threshold: { type: number, nullable: true }
        status: { type: string, enum: [active, acknowledged, recovered] }
        triggeredAt: { type: string, format: date-time, description: UTC 时间，始终带 Z 后缀 }
        handledAt: { type: string, format: date-time, nullable: true, description: UTC 时间，始终带 Z 后缀 }
    PlanAdjustmentReminder:
      type: object
      required: [id, plotId, type, description, status, triggeredAt, affectedTasks]
      properties:
        id: { type: string, example: PR001 }
        plotId: { type: string, example: P001 }
        plotName: { type: string }
        type: { type: string, enum: [low_moisture, continuous_rain, device_offline] }
        description: { type: string }
        status: { type: string, enum: [active, handled, recovered] }
        dispositionAction: { type: string, enum: [adjust_as_suggested, keep_original_plan, handled], nullable: true }
        dispositionNote: { type: string, nullable: true }
        disposedBy: { type: string, nullable: true }
        disposedByName: { type: string, nullable: true }
        disposedAt: { type: string, format: date-time, nullable: true }
        triggeredAt: { type: string, format: date-time }
        recoveredAt: { type: string, format: date-time, nullable: true }
        affectedTasks:
          type: array
          items:
            type: object
            properties:
              id: { type: string, example: MT001 }
              title: { type: string }
              type: { type: string }
              scheduledDate: { type: string, format: date }
    PlanAdjustmentReminderDispositionRequest:
      type: object
      required: [action, note]
      properties:
        action: { type: string, enum: [adjust_as_suggested, keep_original_plan, handled] }
        note: { type: string, minLength: 1, maxLength: 1000 }
    ChatReply:
      type: object
      properties:
        sessionId: { type: string }
        answer: { type: string }
        sources:
          type: array
          items: { type: string }
