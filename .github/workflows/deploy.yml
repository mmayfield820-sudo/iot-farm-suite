name: Deploy to server

on:
  push:
    branches: [deploy/fullstack]   # 改为你要自动部署的分支

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /root/farm/iot-farm-suite
            git pull
            # 清理历史/中断部署残留的 smart-farm-ai 容器，避免容器名冲突导致 compose 重建失败。
            # 数据都在 volume 里，删容器不影响；xargs -r 在无匹配时跳过（安全）。
            docker ps -aq --filter "label=com.docker.compose.service=smart-farm-ai" | xargs -r docker rm -f
            docker ps -aq --filter "name=smart-farm-ai" | xargs -r docker rm -f
            cd infra
            # 切换最终版数据库卷前，先备份仍在运行的旧数据库；旧卷本身也不会删除。
            mkdir -p /root/farm/backups
            if docker ps --format '{{.Names}}' | grep -qx 'farm-mysql'; then
              backup_file="/root/farm/backups/farm-before-final-$(date +%Y%m%d-%H%M%S).sql"
              docker exec farm-mysql sh -c \
                'MYSQL_PWD="$MYSQL_PASSWORD" exec mysqldump -u"$MYSQL_USER" "$MYSQL_DATABASE"' \
                > "$backup_file"
              test -s "$backup_file"
            fi
            # 启动全新的最终版数据库，并按 001～035 顺序完成初始化与迁移。
            docker compose --env-file ../.env up -d mysql emqx
            docker compose --env-file ../.env run --rm db-migrate
            docker compose --env-file ../.env up -d --build
