name: Deploy to server

on:
  push:
    branches: [deploy/fullstack]   # 改为你要自动部署的分支

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /root/farm/iot-farm-suite
            git pull
            # 清理历史/中断部署残留的 smart-farm-ai 容器，避免容器名冲突导致 compose 重建失败。
            # 数据都在 volume 里，删容器不影响；xargs -r 在无匹配时跳过（安全）。
            docker ps -aq --filter "label=com.docker.compose.service=smart-farm-ai" | xargs -r docker rm -f
            docker ps -aq --filter "name=smart-farm-ai" | xargs -r docker rm -f
            cd infra
            docker compose --env-file ../.env up -d --build
