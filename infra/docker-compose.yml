# Smart agriculture local dependencies
services:
  mysql:
    image: mysql:8.0
    command: ["--default-time-zone=+00:00"]
    container_name: farm-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-farm}
      MYSQL_USER: ${MYSQL_USER:-farm}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-farm}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-farm-root}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../database/schema/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ../database/schema/002_reference_data.sql:/docker-entrypoint-initdb.d/002_reference_data.sql:ro
      - ../database/schema/003_mqtt_tracking.sql:/docker-entrypoint-initdb.d/003_mqtt_tracking.sql:ro
      - ../database/schema/004_device_uuid_migration.sql:/docker-entrypoint-initdb.d/004_device_uuid_migration.sql:ro
      - ../database/schema/005_unbound_device_support.sql:/docker-entrypoint-initdb.d/005_unbound_device_support.sql:ro
      - ../database/schema/006_user_registration_and_scopes.sql:/docker-entrypoint-initdb.d/006_user_registration_and_scopes.sql:ro
      - ../database/schema/007_localize_demo_data.sql:/docker-entrypoint-initdb.d/007_localize_demo_data.sql:ro
      - ../database/schema/008_phase2_account_and_master_data.sql:/docker-entrypoint-initdb.d/008_phase2_account_and_master_data.sql:ro
      - ../database/schema/009_phase2_identity_initial_password.sql:/docker-entrypoint-initdb.d/009_phase2_identity_initial_password.sql:ro
      - ../database/schema/010_phase2_templates_and_plans.sql:/docker-entrypoint-initdb.d/010_phase2_templates_and_plans.sql:ro
      - ../database/schema/011_phase2_farm_production_profile.sql:/docker-entrypoint-initdb.d/011_phase2_farm_production_profile.sql:ro
      - ../database/schema/012_phase2_template_draft_farm_scope.sql:/docker-entrypoint-initdb.d/012_phase2_template_draft_farm_scope.sql:ro
      - ../database/schema/013_phase2_task_execution_history.sql:/docker-entrypoint-initdb.d/013_phase2_task_execution_history.sql:ro
      - ../database/schema/014_phase2_stage_moisture_alerts.sql:/docker-entrypoint-initdb.d/014_phase2_stage_moisture_alerts.sql:ro
      - ../database/schema/015_phase2_plan_adjustment_reminders.sql:/docker-entrypoint-initdb.d/015_phase2_plan_adjustment_reminders.sql:ro
      - ../database/schema/016_phase2_plan_adjustment_disposition.sql:/docker-entrypoint-initdb.d/016_phase2_plan_adjustment_disposition.sql:ro
      - ../database/schema/017_phase2_audit_logs.sql:/docker-entrypoint-initdb.d/017_phase2_audit_logs.sql:ro
      - ../database/schema/018_farm_annual_production.sql:/docker-entrypoint-initdb.d/018_farm_annual_production.sql:ro
      - ../database/schema/019_farm_planting_workflow.sql:/docker-entrypoint-initdb.d/019_farm_planting_workflow.sql:ro
      - ../database/schema/020_scheduled_irrigation_stop.sql:/docker-entrypoint-initdb.d/020_scheduled_irrigation_stop.sql:ro
      - ../database/schema/021_device_switch_state.sql:/docker-entrypoint-initdb.d/021_device_switch_state.sql:ro
      - ../database/schema/022_today_weather_reminders.sql:/docker-entrypoint-initdb.d/022_today_weather_reminders.sql:ro
      - ../database/schema/023_expand_orchard_management_plan.sql:/docker-entrypoint-initdb.d/023_expand_orchard_management_plan.sql:ro
      - ../database/schema/024_recurring_management_tasks.sql:/docker-entrypoint-initdb.d/024_recurring_management_tasks.sql:ro
      - ../database/schema/025_user_avatar.sql:/docker-entrypoint-initdb.d/025_user_avatar.sql:ro
      - ../database/schema/026_standardize_soil_moisture_wording.sql:/docker-entrypoint-initdb.d/026_standardize_soil_moisture_wording.sql:ro
      - ../database/schema/027_annual_stage_workflow.sql:/docker-entrypoint-initdb.d/027_annual_stage_workflow.sql:ro
      - ../database/schema/028_task_change_orders_and_temporary_tasks.sql:/docker-entrypoint-initdb.d/028_task_change_orders_and_temporary_tasks.sql:ro
      - ../database/schema/029_append_only_task_completion_corrections.sql:/docker-entrypoint-initdb.d/029_append_only_task_completion_corrections.sql:ro
      - ../database/schema/030_historical_stage_supplements.sql:/docker-entrypoint-initdb.d/030_historical_stage_supplements.sql:ro
      - ../database/schema/031_annual_production_archives.sql:/docker-entrypoint-initdb.d/031_annual_production_archives.sql:ro
      - ../database/schema/032_backfill_farm_manager_name.sql:/docker-entrypoint-initdb.d/032_backfill_farm_manager_name.sql:ro
      - ../database/schema/033_employee_number_login.sql:/docker-entrypoint-initdb.d/033_employee_number_login.sql:ro
      - ../database/seed/001_demo_data.sql:/docker-entrypoint-initdb.d/003_demo_data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  emqx:
    image: emqx/emqx
    container_name: emqx
    restart: unless-stopped
    ports:
      - "1884:1883"
      - "8083:8083"
      - "18083:18083"

volumes:
  mysql_data:
