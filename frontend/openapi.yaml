openapi: 3.0.3
info:
  title: Smart Agriculture Frontend API Contract
  version: 1.1.0
  description: |
    前端联调契约。本文件是可独立使用的完整契约，确认后可直接替换 contracts/openapi.yaml。

    合并原则：
    1. 旧版已经定义的路径、方法、请求体、响应体和枚举均完整内嵌，并保持旧版定义。
    2. 只有旧版完全没有覆盖的注册审核、用户管理、灌溉记录、灌溉参数和天气接口才在本文件扩展。
    3. 功能相同但名称不同的新版接口不再保留，前端后续应改用旧版名称。
    4. 扩展接口同样以 /api 为前缀，使用 Bearer Token，时间使用带时区的 ISO 8601。

    新旧名称映射：
    - /plots + /plots/{plotId}/detail + /sensors/latest -> /farms/{farmId}/overview
    - /sensors/history -> /plots/{plotId}/metrics
    - /devices/plot/{plotId}/status -> /devices/{deviceId}/status
    - /plots/{plotId}/threshold 中的告警阈值 -> /alert-rules
    - AI 咨询类接口 -> /chat/sessions/{sessionId}/messages
servers:
  - url: /api
    description: 当前站点后端 API
tags:
  - name: Auth
  - name: Registration
  - name: Farms
  - name: Devices
  - name: Telemetry
  - name: Commands
  - name: Alerts
  - name: Chat
  - name: Irrigation
  - name: Users
  - name: Weather

security:
  - bearerAuth: []

paths:
  # 以下路径沿用旧版 contracts/openapi.yaml 的定义。
  /auth/login:
    post:
      tags: [Auth]
      summary: 用户登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /farms:
    get:
      tags: [Farms]
      summary: 查询当前用户的农场
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 农场列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Farm'
  /farms/{farmId}/overview:
    get:
      tags: [Farms]
      summary: 查询农场下所有地块的当前概况
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/FarmId'
      responses:
        '200':
          description: 地块、最新指标和设备状态
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlotOverview'
  /devices:
    get:
      tags: [Devices]
      summary: 查询设备
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: plotId
          schema:
            type: string
      responses:
        '200':
          description: 设备列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Device'
    post:
      tags: [Devices]
      summary: 注册设备
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceCreateRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
  /devices/{deviceId}/commands:
    post:
      tags: [Commands]
      summary: 下发灌溉控制指令
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommandCreateRequest'
      responses:
        '202':
          description: 指令已下发，等待设备结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Command'
  /devices/{deviceId}/bind:
    post:
      tags: [Devices]
      summary: 将设备绑定到地块
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceBindRequest'
      responses:
        '200':
          description: 绑定成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
    delete:
      tags: [Devices]
      summary: 解除设备绑定
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '204':
          description: 解绑成功
  /devices/{deviceId}/status:
    get:
      tags: [Devices]
      summary: 查询设备在线状态
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: 设备状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceStatus'
  /commands/{commandId}:
    get:
      tags: [Commands]
      summary: 查询指令执行状态
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: commandId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 指令状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Command'
  /plots/{plotId}/metrics:
    get:
      tags: [Telemetry]
      summary: 查询地块历史指标
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/PlotId'
        - in: query
          name: type
          required: true
          schema:
            type: string
            enum: [temperature, humidity]
        - in: query
          name: from
          required: true
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          required: true
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: 时间序列数据
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MetricPoint'
  /alerts:
    get:
      tags: [Alerts]
      summary: 查询告警记录
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 告警列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Alert'
  /alert-rules:
    get:
      tags: [Alerts]
      summary: 查询告警规则
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 告警规则列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlertRule'
    post:
      tags: [Alerts]
      summary: 创建或更新阈值规则
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertRuleRequest'
      responses:
        '200':
          description: 保存成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertRule'
  /alerts/{alertId}/ack:
    post:
      tags: [Alerts]
      summary: 确认告警
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: alertId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 确认成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert'
  /chat/health:
    get:
      tags: [Chat]
      summary: 查询农业智能体及模型是否可用
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 智能体健康状态
          content:
            application/json:
              schema:
                type: object
                required: [available, modelEnabled, searchEnabled]
                properties:
                  available:
                    type: boolean
                  modelEnabled:
                    type: boolean
                  searchEnabled:
                    type: boolean

  /chat/sessions/{sessionId}/messages:
    post:
      tags: [Chat]
      summary: 向农业智能体提问
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
                plotId:
                  type: string
      responses:
        '200':
          description: 智能体回答
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatReply'

  # 以下为旧版没有覆盖、但当前前端业务需要的扩展接口。
  /auth/register:
    post:
      tags: [Registration]
      summary: 提交注册申请
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationCreateRequest'
      responses:
        '201':
          description: 注册申请提交成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationApplication'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /registration-applications:
    get:
      tags: [Registration]
      summary: 查询注册申请
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [待审核, 已通过, 已拒绝]
      responses:
        '200':
          description: 注册申请数组
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RegistrationApplication'
        '403':
          $ref: '#/components/responses/Forbidden'

  /registration-applications/{applicationId}/approve:
    put:
      tags: [Registration]
      summary: 通过注册申请
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      responses:
        '200':
          description: 审核后的申请
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationApplication'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /registration-applications/{applicationId}/reject:
    put:
      tags: [Registration]
      summary: 驳回注册申请
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: 审核后的申请
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationApplication'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /irrigation/records:
    get:
      tags: [Irrigation]
      summary: 查询地块灌溉记录
      parameters:
        - in: query
          name: plotId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 灌溉记录数组
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IrrigationRecord'
        '403':
          $ref: '#/components/responses/Forbidden'

  /plots/{plotId}/irrigation-settings:
    get:
      tags: [Irrigation]
      summary: 查询地块灌溉时长和自动灌溉间隔
      description: 湿度告警阈值不在此接口维护，应使用旧版 /alert-rules。
      parameters:
        - $ref: '#/components/parameters/PlotId'
      responses:
        '200':
          description: 当前灌溉参数
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IrrigationSettings'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Irrigation]
      summary: 更新地块灌溉时长和自动灌溉间隔
      parameters:
        - $ref: '#/components/parameters/PlotId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IrrigationSettingsUpdateRequest'
      responses:
        '200':
          description: 更新后的灌溉参数
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IrrigationSettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /users:
    get:
      tags: [Users]
      summary: 查询用户列表
      parameters:
        - in: query
          name: keyword
          schema:
            type: string
      responses:
        '200':
          description: 用户数组
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserSummary'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Users]
      summary: 创建用户
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSaveRequest'
      responses:
        '201':
          description: 创建后的用户
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /users/{userId}:
    put:
      tags: [Users]
      summary: 更新用户和授权范围
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSaveRequest'
      responses:
        '200':
          description: 更新后的用户
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/{userId}/active:
    put:
      tags: [Users]
      summary: 启用或禁用用户账号
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [active]
              properties:
                active:
                  type: boolean
      responses:
        '200':
          description: 更新后的用户
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/{userId}/reset-password:
    post:
      tags: [Users]
      summary: 重置用户密码
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: 密码重置请求已处理
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: string
                  temporaryPassword:
                    type: string
                    nullable: true
        '404':
          $ref: '#/components/responses/NotFound'

  /weather/forecast:
    get:
      tags: [Weather]
      summary: 根据地块位置查询当前天气和预报
      parameters:
        - in: query
          name: plotId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 天气数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeatherForecast'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: 第三方天气服务不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    FarmId:
      in: path
      name: farmId
      required: true
      schema:
        type: string
        example: F001
    PlotId:
      in: path
      name: plotId
      required: true
      schema:
        type: string
        example: P001
    DeviceId:
      in: path
      name: deviceId
      required: true
      schema:
        type: string
        example: D003
    UserId:
      in: path
      name: userId
      required: true
      schema:
        type: string
      example: U001
    ApplicationId:
      in: path
      name: applicationId
      required: true
      schema:
        type: string
      example: REG001

  responses:
    BadRequest:
      description: 请求参数不正确
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: 未登录或令牌无效
    Forbidden:
      description: 没有访问该资源的权限
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: 资源状态冲突或重复操作
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    # 以下 schema 沿用旧版 contracts/openapi.yaml 的定义。
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    LoginResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/User'
    User:
      type: object
      properties:
        id:
          type: string
          example: U001
        username:
          type: string
        role:
          type: string
          enum: [farmer, farm_admin, system_admin]
    Farm:
      type: object
      properties:
        id:
          type: string
          example: F001
        name:
          type: string
    PlotOverview:
      type: object
      properties:
        plot:
          $ref: '#/components/schemas/Plot'
        latestMetrics:
          type: array
          items:
            $ref: '#/components/schemas/MetricPoint'
        devices:
          type: array
          items:
            $ref: '#/components/schemas/Device'
    Plot:
      type: object
      properties:
        id:
          type: string
          example: P001
        farmId:
          type: string
          example: F001
        name:
          type: string
    Device:
      type: object
      properties:
        id:
          type: string
          example: D001
        deviceNo:
          type: string
          example: SENSOR-001
        mqttDeviceId:
          type: string
          example: device_001
        type:
          type: string
          enum: [temperature, humidity, irrigation]
        plotId:
          type: string
          example: P001
        status:
          type: string
          enum: [online, offline]
        workStatus:
          type: string
          enum: [running, stopped]
        lastSeenAt:
          type: string
          format: date-time
    DeviceCreateRequest:
      type: object
      required: [deviceNo, mqttDeviceId, type, plotId]
      properties:
        deviceNo:
          type: string
        mqttDeviceId:
          type: string
        type:
          type: string
          enum: [temperature, humidity, irrigation]
        plotId:
          type: string
    DeviceBindRequest:
      type: object
      required: [plotId]
      properties:
        plotId:
          type: string
          example: P001
    DeviceStatus:
      type: object
      required: [deviceId, status]
      properties:
        deviceId:
          type: string
          example: D001
        status:
          type: string
          enum: [online, offline]
        workStatus:
          type: string
          enum: [running, stopped]
        lastSeenAt:
          type: string
          format: date-time
    MetricPoint:
      type: object
      properties:
        type:
          type: string
          enum: [temperature, humidity]
        value:
          type: number
          format: double
        unit:
          type: string
          example: C
        ts:
          type: string
          format: date-time
    CommandCreateRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [irrigation_on, irrigation_off]
        plannedDuration:
          type: integer
          minimum: 1
          maximum: 240
          nullable: true
          description: 开启灌溉时的计划时长；关闭指令不传。
    Command:
      type: object
      properties:
        commandId:
          type: string
          example: CMD0001
        deviceId:
          type: string
          example: D003
        action:
          type: string
          enum: [irrigation_on, irrigation_off]
        status:
          type: string
          enum: [pending, success, failed, timeout]
        createdAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
          nullable: true
    AlertRuleRequest:
      type: object
      required: [plotId, metricType, operator, threshold]
      properties:
        plotId:
          type: string
        metricType:
          type: string
          enum: [temperature, humidity]
        operator:
          type: string
          enum: ['<', '>', '<=', '>=']
        threshold:
          type: number
        enabled:
          type: boolean
          default: true
    AlertRule:
      allOf:
        - $ref: '#/components/schemas/AlertRuleRequest'
        - type: object
          properties:
            id:
              type: string
    Alert:
      type: object
      properties:
        id:
          type: string
        plotId:
          type: string
        metricType:
          type: string
          enum: [temperature, humidity]
        value:
          type: number
        threshold:
          type: number
        status:
          type: string
          enum: [active, acknowledged, recovered]
        triggeredAt:
          type: string
          format: date-time
    ChatReply:
      type: object
      properties:
        sessionId:
          type: string
        answer:
          type: string
        sources:
          type: array
          items:
            type: string

    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: DEVICE_OFFLINE
        message:
          type: string
          example: 设备当前离线，无法执行操作
        details:
          type: object
          additionalProperties: true

    RegistrationCreateRequest:
      type: object
      required: [username, password, real_name, role_codes]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
        real_name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        role_codes:
          type: array
          items:
            type: string
            enum: [farmer, farmAdmin]
        plot_ids:
          type: array
          items:
            type: string
        farm_ids:
          type: array
          items:
            type: string

    RegistrationApplication:
      type: object
      required: [id, username, realName, roles, plotIds, farmIds, status, createdAt]
      properties:
        id:
          type: string
        username:
          type: string
